
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Panel Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        #secretPanel {
            display: none;
            background-color: #e2f0d9;
            border: 1px solid #385723;
            color: #385723;
        }
    </style>
</head>
<body>

    <!-- Login Form Panel -->
    <div class="container" id="loginPanel">
        <h2> Authority Access</h2>
        <p>to verify yourself enter my state that i belong:</p>
        <input type="password" id="passwordInput" placeholder="Enter the state">

        <button onclick="checkPassword()">Unlock Panel</button>
        <div class="error" id="errorMessage">Incorrect password! Try again.</div>
    </div>

    <!-- Hidden Secret Panel -->
    <div class="container" id="secretPanel">
        <h2>🔓 Welcome, Admin!</h2>
        <p>This is your private panel. You successfully logged in.</p>
        <A href="02_portabelink.html" target="_blank">
		<button type ="button"> visit home</BUTTON>
		
		</A>
    </div>

    <script>
        // CHANGE YOUR PASSWORD HERE
        const SECRET_PASSWORD = "jharkhand";

        function checkPassword() {
            const userInput = document.getElementById("passwordInput").value;
            const loginPanel = document.getElementById("loginPanel");
            const secretPanel = document.getElementById("secretPanel");
            const errorMessage = document.getElementById("errorMessage");

            if (userInput === SECRET_PASSWORD) {
                loginPanel.style.display = "none";
                secretPanel.style.display = "block";
                errorMessage.style.display = "none";
            } else {
                errorMessage.style.display = "block";
                document.getElementById("passwordInput").value = "";
				
            }
        }

        function logout() {
            document.getElementById("loginPanel").style.display = "block";
            document.getElementById("secretPanel").style.display = "none";
            document.getElementById("passwordInput").value = "";
        }
    </script>

</body>
</html>
